name: E2E resume budget regression
on:
  push:
    branches: [diagnose/e2e-cold-start-20261007]
permissions:
  contents: read
jobs:
  e2e-test:
    name: budget-regression (${{ matrix.variant }}, ${{ matrix.dataplane }})
    runs-on: ubuntu-latest
    # Cluster bring-up, image builds and two sequential lanes; generous, but far
    # short of the six-hour platform default a hung lane would otherwise consume.
    timeout-minutes: 120
    continue-on-error: false
    strategy:
      fail-fast: false
      matrix:
        include:
        - variant: baseline
          dataplane: agentgateway
          ref: 0b91488d79637052458a29a6ba6c757bcf7a9292
    env:
      E2E_ATENET_DATAPLANE: ${{ matrix.dataplane }}
      # The installer requires a credential provider selection, and deploys the
      # bundled Kubernetes Secrets provider with the control plane. Job-wide
      # because every ate-setup invocation reads it, including the control
      # plane redeploy in run-microvm-demo-kind.sh.
      ATE_CREDENTIAL_PROVIDER: '{"name":"k8s.io"}'
      # E2E_JUNIT_FILE is set per step, not here: the lanes below share this
      # job, so one job-level path would have each overwrite the last.
      ARTIFACTS: ${{ github.workspace }}/_artifacts
      # Cache the envoy-dataplane Rust build. Only main writes it, so PRs
      # share one copy instead of each storing their own.
      DOCKER_BUILD_FLAGS: >-
        --cache-from type=gha,scope=envoy-dataplane
        ${{ github.ref == 'refs/heads/main' && matrix.dataplane == 'envoy'
          && '--cache-to type=gha,mode=max,scope=envoy-dataplane,ignore-error=true' || '' }}
    steps:
    - name: Checkout
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      with:
        ref: ${{ matrix.ref }}
    - name: Inject slow combined-volume restore
      run: |
        python3 - <<'PY'
        from pathlib import Path
        p = Path('cmd/ateom-microvm/restore.go')
        source = p.read_text()
        needle = 'func (s *AteomService) RestoreWorkload(ctx context.Context, req *ateompb.RestoreWorkloadRequest) (resp *ateompb.RestoreWorkloadResponse, retErr error) {\n'
        assert source.count(needle) == 1
        delay = '\tif req.GetAtespace() == "combinedvolumes" {\n\t\tslog.WarnContext(ctx, "[DEBUG-e2e-budget] injecting seven-second restore delay")\n\t\tselect {\n\t\tcase <-ctx.Done():\n\t\t\treturn nil, ctx.Err()\n\t\tcase <-time.After(7 * time.Second):\n\t\t}\n\t}\n'
        p.write_text(source.replace(needle, needle + delay))
        PY
        gofmt -w cmd/ateom-microvm/restore.go
    - name: Setup Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
      with:
        go-version-file: 'go.mod'
        # Use the e2e cache below instead. setup-go's cache key is shared with
        # run-tests, whose unit-test builds don't match ko's flags
        # (CGO_ENABLED=0, -trimpath), so ko got no cache hits from it.
        cache: false
    - name: Restore Go build cache
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: e2e-go-${{ runner.os }}-${{ github.sha }}
        restore-keys: e2e-go-${{ runner.os }}-
    - name: Set up Docker Buildx
      # The docker-container driver is what can use the GitHub Actions cache.
      # Host networking and plain HTTP let it push to the kind registry.
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      with:
        driver-opts: network=host
        buildkitd-config-inline: |
          [registry."localhost:5001"]
            http = true
    - name: Expose GitHub runtime to buildx
      # buildx's gha cache backend reads these from the environment, but the
      # runner only passes them to actions, not to run steps.
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      with:
        script: |
          for (const [key, value] of Object.entries(process.env)) {
            if (key.startsWith('ACTIONS_')) core.exportVariable(key, value);
          }
    - name: Cache micro-VM assets
      id: microvm-assets
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        # Assembling the assets (download kata-static + cloud-hypervisor + the
        # prebuilt virtiofsd — all downloads on amd64) is fully pinned by assemble.sh,
        # so key the cache on its hash. The push-to-main run populates the
        # default-branch cache PRs inherit; the weekly schedule refreshes it.
        # run-microvm-demo-kind.sh skips assembling when these are present.
        path: bin/microvm-assets/amd64
        key: microvm-assets-amd64-${{ hashFiles('hack/microvm-assets/assemble.sh') }}
    - name: Enable KVM
      # Grant the runner access to /dev/kvm so create-kind-cluster.sh mounts it into
      # the node and labels it for the micro-VM sandbox class.
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
          | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
    - name: Create cluster
      run: hack/create-kind-cluster.sh
    - name: Install Agent Substrate (${{ matrix.dataplane }})
      # The dataplane selection applies to both the ingress router and egress
      # gateway.
      run: hack/install-ate-kind.sh --deploy-ate-system --atenet-dataplane=${{ matrix.dataplane }}
    - name: Enable NFS
      # Load NFS kernel modules so in-cluster NFS server and CSI driver can run.
      run: |
        sudo modprobe nfs || true
        sudo modprobe nfsd || true
    - name: Install CSI NFS driver
      run: hack/install-ate-kind.sh --setup-csi=nfs
    - name: Deploy micro-VM counter demo
      # Stages the (cached) assets into the cluster's rustfs and deploys the
      # counter-microvm demo onto the control plane installed above. The demo
      # redeploys the control plane, so retain the selected dataplane.
      env:
        ATE_ATENET_DATAPLANE: ${{ matrix.dataplane }}
      run: hack/run-microvm-demo-kind.sh
    - name: Deploy gVisor counter demo
      run: hack/install-ate-kind.sh --deploy-demo-counter
    - name: Deploy egress demos
      # TestActorEgress in the networking suite builds its Actor from the egress
      # ActorTemplate for the class under test, so both fixtures have to exist
      # before their respective lane runs. The demo's actors trust the CA the
      # gateway mints its leaves from.
      run: |
        hack/install-ate-kind.sh --deploy-demo-egress
        hack/install-ate-kind.sh --deploy-demo-egress-microvm
    # scale the idle sandbox class's demo pools to zero so each lane has the node
    - name: Focus the node on gVisor
      run: hack/e2e-focus-sandbox-class.sh gvisor
    - name: Run E2E tests (gVisor)
      env:
        E2E_PARALLELISM: 8
        E2E_JUNIT_FILE: ${{ github.workspace }}/_artifacts/e2e-gvisor.xml
      run: hack/run-e2e-kind.sh -v -args --no-color
    - name: Focus the node on micro-VM
      run: hack/e2e-focus-sandbox-class.sh microvm
    - name: Run E2E tests (micro-VM)
      # The same suites again, with every fixture repointed at its micro-VM
      # variant by the single E2E_SANDBOX_CLASS knob (see internal/e2e/sandbox.go).
      env:
        E2E_SANDBOX_CLASS: microvm
        E2E_PARALLELISM: 8
        E2E_JUNIT_FILE: ${{ github.workspace }}/_artifacts/e2e-microvm.xml
      run: hack/run-e2e-kind.sh -v -args --no-color
    # Every lane must have reported tests; a `-run` filter that stops matching
    # otherwise leaves its lane green and empty. The set comes from the manifest
    # each lane registers itself in, so adding a lane needs no change here, and
    # run-e2e.sh refuses to run in CI without E2E_JUNIT_FILE.
    - name: Require every lane to have run tests
      if: always()
      run: |
        make build-junittool
        bin/junittool verify -manifest "${ARTIFACTS}/expected-junit.txt"
    - name: Save Go build cache
      # Main only, so PRs restore the latest main build rather than each
      # storing its own copy.
      if: ${{ !cancelled() && github.ref == 'refs/heads/main' && matrix.dataplane == 'envoy' }}
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: e2e-go-${{ runner.os }}-${{ github.sha }}
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: test-results-e2e-${{ matrix.variant }}-${{ matrix.dataplane }}
        path: ${{ env.ARTIFACTS }}
        if-no-files-found: error
    - name: Dump diagnostics on failure
      if: failure()
      run: |
        kubectl --context kind-kind get workerpool,pods -A -o wide || true
        dump() {
          echo "=== logs: $1/$2 ==="
          kubectl --context kind-kind logs -n "$1" "$2" --all-containers --tail=300 2>/dev/null || true
        }
        for p in $(kubectl --context kind-kind get pods -n ate-system -o name 2>/dev/null); do
          dump ate-system "$p"
        done
        # Every worker pod in any namespace: the demo pools plus the e2e suites'
        # randomly-named per-test namespaces, which the suites keep on failure.
        # The failing actor runs in one of these, so this is where its ateom logs
        # (and, for a micro-VM worker, the guest console tail) live.
        kubectl --context kind-kind get pods -A -l ate.dev/worker-pool \
          -o 'custom-columns=:.metadata.namespace,:.metadata.name' --no-headers 2>/dev/null \
          | while read -r ns name; do dump "$ns" "$name"; done
